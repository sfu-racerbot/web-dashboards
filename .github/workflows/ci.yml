# Checks only: the tests, the Lichtblick build, the asset-size check and a
# dry-run deploy, on every pull request and every push.
#
# Deploying is not done here. Cloudflare's own Workers Builds is connected to
# this repo in the Cloudflare dashboard and deploys every push to main (see
# docs/cloudflare-setup.md, step 5). So this workflow needs no secrets at all.

name: ci

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Simple dashboard tests (plain node)
        run: npm run test:simple
      - name: Worker unit tests (vitest)
        run: npm run test:worker
      - name: Mock car tests (node:test)
        run: npm run test:mock
      - name: Typecheck the Worker
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Read the pinned Lichtblick version
        id: lichtblick
        run: echo "version=$(tr -d '[:space:]' < apps/advanced/LICHTBLICK_VERSION)" >> "$GITHUB_OUTPUT"

      # Lichtblick keeps its Yarn cache inside the checkout (enableGlobalCache:
      # false), so that folder is what is worth caching. The install still
      # runs every time; with a warm cache it only links, it does not download.
      - name: Cache Lichtblick's Yarn packages
        uses: actions/cache@v4
        with:
          path: apps/advanced/.build/lichtblick/.yarn/cache
          key: lichtblick-yarn-${{ steps.lichtblick.outputs.version }}

      - name: Build Lichtblick ${{ steps.lichtblick.outputs.version }} from source
        run: apps/advanced/build.sh

      - name: Assemble dist/ and check the asset limits
        run: node scripts/assemble.mjs --require-advanced

      - name: Dry-run deploy
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
